name: dev_fastchat

services:
  postgres:
    image: postgres:18-alpine
    container_name: dev_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5430}:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    container_name: dev_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6377}:6379"
    volumes:
      - dev_redis_data:/data
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --appendonly yes
      --appendfsync everysec

volumes:
  dev_postgres_data:
  dev_redis_data: